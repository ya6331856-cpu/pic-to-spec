name: PicToSpec checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pictospec-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --onnxruntime-node-install-cuda=skip --onnxruntime-node-install=skip
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
