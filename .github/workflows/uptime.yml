name: PicToSpec uptime check

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage
        run: curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 https://pictospec.com/ --output /dev/null
      - name: Check sitemap
        run: curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 https://pictospec.com/sitemap.xml --output /dev/null
      - name: Check robots.txt
        run: curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 https://pictospec.com/robots.txt --output /dev/null
